# Veridit (T3): infraestrutura local no lugar da AWS + os serviços do T2.
#   cp .env.example .env
#   docker compose up --build
# Interface (Nginx):        http://localhost:8080
# Health de cada serviço:   http://localhost:3001/api/health ... 3005
# RustFS (console S3):      http://localhost:9001
# Mailpit (e-mails):        http://localhost:8025
# ElasticMQ (estatísticas): http://localhost:9325
#
# Equivalências (desvios pendentes de ADR, ver docs/desvios-pendentes.md):
#   RDS PostgreSQL -> postgres | SQS + DLQ -> elasticmq | S3 Object Lock -> rustfs
#   SES -> mailpit | ECS Fargate + ALB -> serviços abaixo + nginx

name: veridit

x-app: &app
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    elasticmq:
      condition: service_started
    s3-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veridit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veridit}
      POSTGRES_DB: ${POSTGRES_DB:-veridit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      retries: 20

  # Fila de captura com DLQ após 3 recebimentos (ADR-002 e ADR-004 do T2).
  elasticmq:
    image: softwaremill/elasticmq-native
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  # Armazenamento imutável (ADR-003 do T2): RustFS, compatível com a API do S3 e com
  # Object Lock. A MinIO tirou as imagens públicas do Docker Hub e do quay.io em 2026.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-veridit}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-veridit-s3-123}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data

  # Cria o bucket com Object Lock (só é possível na criação) e retenção padrão
  # GOVERNANCE de 1 dia na demonstração; a ADR-003 do T2 pede COMPLIANCE.
  s3-init:
    image: amazon/aws-cli
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-veridit}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-veridit-s3-123}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET_EVIDENCIAS: ${S3_BUCKET_EVIDENCIAS:-evidencias}
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do aws --endpoint-url http://rustfs:9000 s3api list-buckets > /dev/null 2>&1 && break; echo 'aguardando o RustFS...'; sleep 2; done;
      if aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $${S3_BUCKET_EVIDENCIAS} > /dev/null 2>&1; then echo 'bucket já existe'; exit 0; fi;
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $${S3_BUCKET_EVIDENCIAS} --object-lock-enabled-for-bucket &&
      aws --endpoint-url http://rustfs:9000 s3api put-object-lock-configuration --bucket $${S3_BUCKET_EVIDENCIAS}
      --object-lock-configuration '{\"ObjectLockEnabled\":\"Enabled\",\"Rule\":{\"DefaultRetention\":{\"Mode\":\"GOVERNANCE\",\"Days\":1}}}'
      "

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  # Serviço Contas (comp. 01 Cadastro de Usuário, 02 Acesso e Sessão)
  contas-api:
    <<: *app
    build:
      context: .
      args:
        APP: contas-api
    environment:
      SERVICO: contas-api
      PORT: "3000"
    ports:
      - "3001:3000"

  # Serviço Créditos e Pagamentos (comp. 07 Controle de Créditos)
  creditos-api:
    <<: *app
    build:
      context: .
      args:
        APP: creditos-api
    environment:
      SERVICO: creditos-api
      PORT: "3000"
    ports:
      - "3002:3000"

  # Serviço Registro e Captura (comp. 09 Solicitação de Registro)
  registro-api:
    <<: *app
    build:
      context: .
      args:
        APP: registro-api
    environment:
      SERVICO: registro-api
      PORT: "3000"
    ports:
      - "3003:3000"

  # Serviço Registro e Captura (comp. 10 Captura, worker da fila)
  captura-worker:
    <<: *app
    build:
      context: .
      args:
        APP: captura-worker
    environment:
      SERVICO: captura-worker
      PORT: "3000"

  # Serviço Evidência (comp. 11 a 14 e trilha)
  evidencia-api:
    <<: *app
    build:
      context: .
      args:
        APP: evidencia-api
    environment:
      SERVICO: evidencia-api
      PORT: "3000"
    ports:
      - "3004:3000"

  # Serviço Registros e Relatórios (comp. 15 Conclusão, 18 Consulta)
  relatorios-api:
    <<: *app
    build:
      context: .
      args:
        APP: relatorios-api
    environment:
      SERVICO: relatorios-api
      PORT: "3000"
    ports:
      - "3005:3000"

  # Porta de entrada (no T2: Application Load Balancer). Só expõe as rotas
  # públicas; /api/internal/* e o evidencia-api ficam fora.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - contas-api
      - creditos-api
      - registro-api
      - relatorios-api

volumes:
  pgdata:
  s3data:
