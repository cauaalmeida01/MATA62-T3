# ElasticMQ: fila compatível com o Amazon SQS (ADR-002 do T2).
# "captura" manda a mensagem para "captura-dlq" depois de 3 recebimentos sem
# confirmação: as 3 tentativas da ADR-004 do T2.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  captura {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "captura-dlq"
      maxReceiveCount = 3
    }
  }
  captura-dlq { }
}
