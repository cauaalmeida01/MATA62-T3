# Porta de entrada do Veridit (no T2: Application Load Balancer).
# Só as rotas públicas passam por aqui; as internas (/api/internal/*) não.
server {
  listen 80;
  client_max_body_size 50m;

  location /api/contas       { proxy_pass http://contas-api:3000; }
  location /api/sessoes      { proxy_pass http://contas-api:3000; }
  location /api/creditos     { proxy_pass http://creditos-api:3000; }
  location /api/solicitacoes { proxy_pass http://registro-api:3000; }
  location /api/registros    { proxy_pass http://relatorios-api:3000; }

  location /api/internal { return 404; }

  # Front em React (papel D), embutido na imagem por web/Dockerfile.
  # try_files manda as rotas do React Router (/registros/...) para o index.html.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
